# Bygger og tester på Windows og lægger to filer under GitHub → Releases → "Seneste udgave":
#   BiNumreGenerator-windows.zip  – pak ud og kør BiNumreGenerator.exe (intet skal installeres)
#   BiNumreGenerator-*.msi        – installationsfil (startmenu og genvej, kræver ikke administrator)
name: Byg Windows-pakke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :core:test :desktop:test --console=plain

      - name: Byg program og installationsfil
        run: ./gradlew :desktop:createDistributable :desktop:packageMsi --console=plain

      - name: Pak den selvstændige udgave
        run: |
          app=desktop/build/compose/binaries/main/app/BiNumreGenerator
          mkdir -p "$app/eksempler"
          cp core/src/test/resources/*_eksempel.xml "$app/eksempler/"
          mkdir -p ud
          powershell -Command "Compress-Archive -Path '$app' -DestinationPath ud/BiNumreGenerator-windows.zip"
          cp desktop/build/compose/binaries/main/msi/*.msi ud/

      - uses: actions/upload-artifact@v4
        with:
          name: BiNumreGenerator-windows
          path: ud/*

      - name: Opdater "Seneste udgave"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete seneste --yes --cleanup-tag || true
          gh release create seneste ud/* --prerelease --target "$GITHUB_SHA" \
            --title "Seneste udgave" \
            --notes "Bygget automatisk fra main ($GITHUB_SHA). Hent BiNumreGenerator-windows.zip, pak den ud og kør BiNumreGenerator.exe – eller installer .msi-filen."
