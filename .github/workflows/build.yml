# Bygger og tester på Windows og lægger BiNumreGenerator-testpakke.zip under
# GitHub → Releases → "Seneste udgave": programmet (kører uden installation), .msi-installationsfil,
# testfiler og TESTVEJLEDNING.txt (indholdet kommer fra mappen testpakke/).
# Et versionsmærke (fx v1.0.0) – eller "Run workflow" på main med "udgiv" slået til – giver en rigtig
# udgave "BiNumreGenerator 1.0.0" med zip og .msi (versionen tages fra appVersion).
name: Byg Windows-pakke

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      udgiv:
        description: "Udgiv versionen fra appVersion som en rigtig udgave (kun fra main)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :core:test :desktop:test --console=plain

      - name: Byg program og installationsfil
        run: ./gradlew :desktop:createDistributable :desktop:packageMsi --console=plain

      - name: Saml testpakken
        run: |
          pak=ud/BiNumreGenerator-testpakke
          mkdir -p "$pak/Installation" "$pak/Testfiler"
          cp -r desktop/build/compose/binaries/main/app/BiNumreGenerator "$pak/Program"
          cp desktop/build/compose/binaries/main/msi/*.msi "$pak/Installation/"
          cp core/src/test/resources/*_eksempel.xml "$pak/Testfiler/"
          cp testpakke/startliste_eksempel.* testpakke/flerdages_alle_etaper.xml testpakke/logo_eksempel.png testpakke/stafet_projekt.json "$pak/Testfiler/"
          cp testpakke/TESTVEJLEDNING.txt testpakke/*.bat "$pak/"
          cp LICENSE.txt "$pak/LICENS.txt"
          cp -r desktop/src/main/resources/licenses "$pak/Licenser"
          ls -R "$pak" | head -40
          powershell -Command "Compress-Archive -Path '$pak' -DestinationPath ud/BiNumreGenerator-testpakke.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: BiNumreGenerator-windows
          path: ud/BiNumreGenerator-testpakke.zip

      - name: Opdater "Seneste udgave"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete seneste --yes --cleanup-tag || true
          gh release create seneste ud/BiNumreGenerator-testpakke.zip --prerelease --target "$GITHUB_SHA" \
            --title "Seneste udgave" \
            --notes "Bygget automatisk fra main ($GITHUB_SHA). Hent BiNumreGenerator-testpakke.zip, pak den ud og læs TESTVEJLEDNING.txt."

      - name: Udgiv version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.udgiv && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "Mærket $GITHUB_REF_NAME passer ikke til appVersion $ver i desktop/build.gradle.kts"; exit 1
          fi
          cp ud/BiNumreGenerator-testpakke.zip "ud/BiNumreGenerator-$ver-windows.zip"
          cp desktop/build/compose/binaries/main/msi/*.msi "ud/BiNumreGenerator-$ver.msi"
          gh release create "v$ver" --target "$GITHUB_SHA" "ud/BiNumreGenerator-$ver-windows.zip" "ud/BiNumreGenerator-$ver.msi" \
            --title "BiNumreGenerator $ver" \
            --notes "Windows: hent BiNumreGenerator-$ver.msi og installer (kræver ikke administrator), eller pak BiNumreGenerator-$ver-windows.zip ud og start Program\\BiNumreGenerator.exe. Java følger med. Windows viser måske \"Windows beskyttede din pc\": klik \"Flere oplysninger\" → \"Kør alligevel\"."
